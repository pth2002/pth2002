<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1186 220" width="1186" height="220" role="img"
  aria-label="Four harness bugs: the Idle Clip, the Lost Seed, the Stuck Batch and the Rogue Normaliser.">
  <g>
    <rect x="1" y="1" width="282" height="216" rx="14" fill="#121A27" stroke="#26344A"/>
    <rect x="1" y="1" width="282" height="216" rx="14" fill="none" stroke="#4F8CFF" stroke-width="2" opacity="0">
      <animate attributeName="opacity" dur="6s" begin="0.0s" repeatCount="indefinite" keyTimes="0;0.06;0.22;0.3;1" values="0;1;1;0;0"/>
    </rect>
    <text x="24" y="40" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" font-weight="700" letter-spacing="1" fill="#4F8CFF">BUG 01</text>
    <text x="24" y="76" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#E6EDF3">The Idle Clip</text>
    <text x="24" y="112" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#9AA7B8">The PPO ratio pointed at the</text><text x="24" y="134" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#9AA7B8">learner's own policy, so the</text><text x="24" y="156" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#9AA7B8">clip never fired.</text>
    <line x1="24" x2="260" y1="172" y2="172" stroke="#26344A"/>
    <text x="24" y="197" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#5E6B7D">logged: clip fraction 0.000</text>
  </g>
  <g>
    <rect x="301" y="1" width="282" height="216" rx="14" fill="#121A27" stroke="#26344A"/>
    <rect x="301" y="1" width="282" height="216" rx="14" fill="none" stroke="#4F8CFF" stroke-width="2" opacity="0">
      <animate attributeName="opacity" dur="6s" begin="1.5s" repeatCount="indefinite" keyTimes="0;0.06;0.22;0.3;1" values="0;1;1;0;0"/>
    </rect>
    <text x="324" y="40" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" font-weight="700" letter-spacing="1" fill="#4F8CFF">BUG 02</text>
    <text x="324" y="76" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#E6EDF3">The Lost Seed</text>
    <text x="324" y="112" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#9AA7B8">The data seed never reached</text><text x="324" y="134" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#9AA7B8">one arm. Three runs replayed</text><text x="324" y="156" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#9AA7B8">one data order.</text>
    <line x1="324" x2="560" y1="172" y2="172" stroke="#26344A"/>
    <text x="324" y="197" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#5E6B7D">logged: three seeds</text>
  </g>
  <g>
    <rect x="601" y="1" width="282" height="216" rx="14" fill="#121A27" stroke="#26344A"/>
    <rect x="601" y="1" width="282" height="216" rx="14" fill="none" stroke="#4F8CFF" stroke-width="2" opacity="0">
      <animate attributeName="opacity" dur="6s" begin="3.0s" repeatCount="indefinite" keyTimes="0;0.06;0.22;0.3;1" values="0;1;1;0;0"/>
    </rect>
    <text x="624" y="40" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" font-weight="700" letter-spacing="1" fill="#4F8CFF">BUG 03</text>
    <text x="624" y="76" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#E6EDF3">The Stuck Batch</text>
    <text x="624" y="112" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#9AA7B8">A replay queue served its</text><text x="624" y="134" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#9AA7B8">first batch for 33 updates</text><text x="624" y="156" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#9AA7B8">in a row.</text>
    <line x1="624" x2="860" y1="172" y2="172" stroke="#26344A"/>
    <text x="624" y="197" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#5E6B7D">logged: loss going down</text>
  </g>
  <g>
    <rect x="901" y="1" width="282" height="216" rx="14" fill="#121A27" stroke="#26344A"/>
    <rect x="901" y="1" width="282" height="216" rx="14" fill="none" stroke="#4F8CFF" stroke-width="2" opacity="0">
      <animate attributeName="opacity" dur="6s" begin="4.5s" repeatCount="indefinite" keyTimes="0;0.06;0.22;0.3;1" values="0;1;1;0;0"/>
    </rect>
    <text x="924" y="40" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" font-weight="700" letter-spacing="1" fill="#4F8CFF">BUG 04</text>
    <text x="924" y="76" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#E6EDF3">The Rogue Normaliser</text>
    <text x="924" y="112" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#9AA7B8">One loss divided by a</text><text x="924" y="134" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#9AA7B8">different normaliser than</text><text x="924" y="156" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#9AA7B8">its own equation.</text>
    <line x1="924" x2="1160" y1="172" y2="172" stroke="#26344A"/>
    <text x="924" y="197" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#5E6B7D">logged: the paper's equation</text>
  </g>
</svg>
