      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="linear"
        keyTimes="0;0.445;0.465;0.62;0.66;1" values="0;0;1;1;0;0"/>
    </g>
    <g opacity="0">
      <circle cx="967.6" cy="200" r="11" fill="#F6F8FA" stroke="#2563EB" stroke-width="2"/>
      <text x="967.6" y="204.5" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" font-weight="700" fill="#2563EB">3</text>
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="linear"
        keyTimes="0;0.490;0.510;0.62;0.66;1" values="0;0;1;1;0;0"/>
    </g>
    <g opacity="0">
      <circle cx="1042.8" cy="190" r="11" fill="#F6F8FA" stroke="#2563EB" stroke-width="2"/>
      <text x="1042.8" y="194.5" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" font-weight="700" fill="#2563EB">4</text>
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="linear"
        keyTimes="0;0.535;0.555;0.62;0.66;1" values="0;0;1;1;0;0"/>
    </g>
  </g>
  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" font-weight="700">
    <g opacity="0">
      <rect x="1004" y="156" width="104" height="26" rx="13" fill="#E3ECFD"/>
      <text x="1056" y="173" text-anchor="middle" fill="#2563EB">clean win</text>
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.17;0.19;0.58;0.61;1" values="0;0;1;1;0;0"/>
    </g>
    <g opacity="0">
      <rect x="742" y="96" width="196" height="24" rx="12" fill="#E3ECFD"/>
      <text x="840" y="112" text-anchor="middle" fill="#2563EB">probing the harness</text>
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.37;0.39;0.60;0.62;1" values="0;0;1;1;0;0"/>
    </g>
    <g opacity="0">
