      <text x="1048" y="207" text-anchor="middle" fill="#13968A">a fair tie</text>
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.72;0.75;0.93;0.96;1" values="0;0;1;1;0;0"/>
