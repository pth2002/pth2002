<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img"
  aria-label="Taiheng Pan. Post-training for LLMs, reinforcement learning and memory for agents.">
  <defs>
    <radialGradient id="g1" cx="78%" cy="40%" r="60%">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#E6EBF1"/>
    </pattern>
    <linearGradient id="scan" x1="0" x2="1">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0.28"/>
    </linearGradient>
    <clipPath id="plot"><rect x="740" y="108" width="380" height="220"/></clipPath>
  </defs>
  <rect width="1200" height="400" rx="22" fill="#F6F8FA"/>
  <rect width="1200" height="400" rx="22" fill="url(#dots)"/>
  <rect width="1200" height="400" rx="22" fill="url(#g1)"/>

  <text x="64" y="104" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15" letter-spacing="1.5" fill="#8C959F">github.com/pth2002</text>
  <text x="62" y="178" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="68" font-weight="700" fill="#1F2328" letter-spacing="-1">Taiheng Pan</text>
  <text x="64" y="226" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#57606A">I help language models learn better,</text>
  <text x="64" y="256" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#57606A">and help agents remember what matters.</text>
  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" font-weight="600">
    <rect x="64" y="292" width="146" height="34" rx="17" fill="#E3ECFD"/>
    <text x="137" y="314" text-anchor="middle" fill="#2563EB">RL for LLMs</text>
    <rect x="222" y="292" width="156" height="34" rx="17" fill="#DDF3F0"/>
    <text x="300" y="314" text-anchor="middle" fill="#13968A">agent memory</text>
    <rect x="390" y="292" width="200" height="34" rx="17" fill="#F2F5F9" stroke="#D8DEE4"/>
    <text x="490" y="314" text-anchor="middle" fill="#57606A">honest evaluation</text>
  </g>

  <rect x="716" y="52" width="428" height="296" rx="16" fill="#FFFFFF" stroke="#D8DEE4"/>
  <text x="742" y="86" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#57606A">reward  vs  training step</text>
  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#57606A">
    <circle cx="950" cy="82" r="5" fill="#2563EB"/><text x="961" y="86">new method</text>
    <circle cx="1052" cy="82" r="5" fill="#13968A"/><text x="1063" y="86">baseline</text>
  </g>
  <line x1="742" x2="1118" y1="148" y2="148" stroke="#E6EBF1" stroke-width="1" stroke-dasharray="3 5"/><line x1="742" x2="1118" y1="198" y2="198" stroke="#E6EBF1" stroke-width="1" stroke-dasharray="3 5"/><line x1="742" x2="1118" y1="248" y2="248" stroke="#E6EBF1" stroke-width="1" stroke-dasharray="3 5"/><line x1="742" x2="1118" y1="298" y2="298" stroke="#E6EBF1" stroke-width="1" stroke-dasharray="3 5"/>
  <g clip-path="url(#plot)">
