      <animate attributeName="stroke-dashoffset" dur="10s" repeatCount="indefinite" keyTimes="0;0.14;1" values="520;0;0"/>
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.94;0.99;1" values="1;1;0;0"/>
    </polyline>
    <g opacity="0">
      <rect x="682" y="108" width="60" height="220" fill="url(#scan)"/>
      <rect x="740" y="108" width="2.5" height="220" fill="#2563EB"/>
      <animateTransform attributeName="transform" type="translate" dur="10s" repeatCount="indefinite"
        keyTimes="0;0.38;0.58;1" values="0 0;0 0;380 0;380 0"/>
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.37;0.38;0.58;0.60;1" values="0;0;1;1;0;0"/>
    </g>
    
    <g opacity="0">
      <circle cx="817.2" cy="258" r="11" fill="#F6F8FA" stroke="#2563EB" stroke-width="2"/>
      <text x="817.2" y="262.5" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" font-weight="700" fill="#2563EB">1</text>
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="linear"
        keyTimes="0;0.400;0.420;0.62;0.66;1" values="0;0;1;1;0;0"/>
    </g>
    <g opacity="0">
      <circle cx="892.4" cy="220" r="11" fill="#F6F8FA" stroke="#2563EB" stroke-width="2"/>
