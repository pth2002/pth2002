        keySplines="0 0 1 1;0.4 0 0.2 1;0 0 1 1"/>
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.94;0.99;1" values="1;1;0;0"/>
    </polyline>
    <polyline points="742.0,306 779.6,292 817.2,276 854.8,262 892.4,252 930.0,244 967.6,238 1005.2,234 1042.8,231 1080.4,229 1118.0,228" fill="none" stroke="#13968A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
