<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">PTH Model Systems Lab</title>
  <desc id="desc">A dark technical banner showing a pipeline from base models through post-training and evaluation into agent systems.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.54" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#140b27"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#45dcff"/>
      <stop offset="0.5" stop-color="#7c8cff"/>
      <stop offset="1" stop-color="#bd68ff"/>
    </linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#45dcff"/>
      <stop offset="1" stop-color="#ff6fae"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#83a5d8" stroke-opacity=".075"/>
      <circle cx="1" cy="1" r="1" fill="#8bb7f0" fill-opacity=".12"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <clipPath id="frame">
      <rect x="1" y="1" width="1278" height="418" rx="24"/>
    </clipPath>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .signal { stroke-dasharray: 5 11; animation: flow 2.7s linear infinite; }
    .pulse { animation: pulse 2.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .p2 { animation-delay: .5s; }
    .p3 { animation-delay: 1s; }
    .p4 { animation-delay: 1.5s; }
    @keyframes flow { to { stroke-dashoffset: -32; } }
    @keyframes pulse { 0%,100% { opacity:.35; transform:scale(.82); } 50% { opacity:1; transform:scale(1.08); } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1280" height="420" fill="url(#bg)"/>
    <rect width="1280" height="420" fill="url(#grid)"/>
    <ellipse cx="1060" cy="130" rx="220" ry="175" fill="#6c3cff" opacity=".11" filter="url(#soft)"/>
    <ellipse cx="560" cy="420" rx="350" ry="105" fill="#00d9ff" opacity=".07" filter="url(#soft)"/>

    <path d="M24 87V36a12 12 0 0 1 12-12h51" fill="none" stroke="#49dcff" stroke-width="2" opacity=".7"/>
    <path d="M1193 24h51a12 12 0 0 1 12 12v51" fill="none" stroke="#bd68ff" stroke-width="2" opacity=".7"/>
    <path d="M24 333v51a12 12 0 0 0 12 12h51" fill="none" stroke="#49dcff" stroke-width="2" opacity=".4"/>
    <path d="M1193 396h51a12 12 0 0 0 12-12v-51" fill="none" stroke="#bd68ff" stroke-width="2" opacity=".4"/>

    <g transform="translate(62 58)">
      <circle cx="6" cy="6" r="5" fill="#49dcff" filter="url(#glow)"/>
      <text x="23" y="11" class="mono" font-size="15" letter-spacing="2.3" fill="#9db2cf">PTH // MODEL SYSTEMS LAB</text>
      <rect x="313" y="-3" width="112" height="20" rx="10" fill="#2c153f" stroke="#bd68ff" stroke-opacity=".45"/>
      <text x="329" y="11" class="mono" font-size="10" letter-spacing="1.4" fill="#dcaeff">RESEARCH MODE</text>
    </g>

    <g transform="translate(62 116)">
      <text class="sans" font-size="51" font-weight="780" letter-spacing="-1.5" fill="#f4f8ff">POST-TRAIN THE MODEL.</text>
      <text y="63" class="sans" font-size="51" font-weight="780" letter-spacing="-1.5" fill="url(#accent)">ENGINEER THE AGENT.</text>
      <text y="108" class="mono" font-size="16" letter-spacing="1.2" fill="#91a4c2">LLM ALGORITHMS  ·  POST-TRAINING  ·  REASONING  ·  AGENT SYSTEMS</text>
    </g>

    <g transform="translate(912 66)">
      <circle cx="138" cy="123" r="102" fill="none" stroke="#6380b0" stroke-opacity=".22"/>
      <circle cx="138" cy="123" r="76" fill="none" stroke="#758ed2" stroke-opacity=".28" stroke-dasharray="4 10" class="signal"/>
      <circle cx="138" cy="123" r="49" fill="#111a32" stroke="url(#agent)" stroke-width="2"/>
      <circle cx="138" cy="123" r="30" fill="#0a1224" stroke="#66d8ff" stroke-opacity=".7"/>
      <path d="M126 119l10 10 18-22" fill="none" stroke="#d8f7ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

      <g fill="#0b1326" stroke-width="2">
        <circle cx="138" cy="16" r="8" stroke="#61ddff" class="pulse"/>
        <circle cx="240" cy="87" r="8" stroke="#9a7cff" class="pulse p2"/>
        <circle cx="201" cy="211" r="8" stroke="#e36fff" class="pulse p3"/>
        <circle cx="42" cy="195" r="8" stroke="#758cff" class="pulse p4"/>
        <circle cx="34" cy="72" r="8" stroke="#61ddff" class="pulse p2"/>
      </g>
      <g stroke="#6d92cb" stroke-opacity=".4">
        <path d="M138 25v47"/><path d="M232 91l-48 19"/><path d="M195 204l-31-40"/><path d="M49 190l52-36"/><path d="M42 76l53 29"/>
      </g>
      <text x="92" y="127" class="mono" font-size="11" fill="#7e91ad">EVAL</text>
      <text x="118" y="264" class="mono" font-size="12" letter-spacing="2" fill="#8ca1c0">AGENT LOOP</text>
    </g>

    <g transform="translate(62 330)">
      <path d="M30 18H770" fill="none" stroke="#426084" stroke-width="2"/>
      <path d="M30 18H770" fill="none" stroke="url(#accent)" stroke-width="2" class="signal" filter="url(#glow)"/>

      <g class="mono" font-size="11" letter-spacing="1.2">
        <g transform="translate(0)">
          <rect width="154" height="38" rx="9" fill="#0b172a" stroke="#44cef1" stroke-opacity=".7"/>
          <circle cx="19" cy="19" r="5" fill="#45dcff" class="pulse"/>
          <text x="34" y="23" fill="#c7d6e9">BASE MODEL</text>
        </g>
        <g transform="translate(196)">
          <rect width="154" height="38" rx="9" fill="#10152c" stroke="#708eff" stroke-opacity=".7"/>
          <circle cx="19" cy="19" r="5" fill="#7b91ff" class="pulse p2"/>
          <text x="34" y="23" fill="#c7d6e9">POST-TRAIN</text>
        </g>
        <g transform="translate(392)">
          <rect width="154" height="38" rx="9" fill="#15142e" stroke="#9d78ff" stroke-opacity=".7"/>
          <circle cx="19" cy="19" r="5" fill="#a577ff" class="pulse p3"/>
          <text x="34" y="23" fill="#c7d6e9">EVALUATE</text>
        </g>
        <g transform="translate(588)">
          <rect width="182" height="38" rx="9" fill="#21132e" stroke="#d366ee" stroke-opacity=".7"/>
          <circle cx="19" cy="19" r="5" fill="#d96eff" class="pulse p4"/>
          <text x="34" y="23" fill="#edf1fb">AGENT RUNTIME</text>
        </g>
      </g>
    </g>

    <text x="1001" y="388" class="mono" font-size="10" letter-spacing="1.7" fill="#667b99">BUILD · MEASURE · ITERATE</text>
  </g>
  <rect x="1" y="1" width="1278" height="418" rx="24" fill="none" stroke="url(#accent)" stroke-opacity=".42" stroke-width="2"/>
</svg>
