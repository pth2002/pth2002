name: Generate contribution trace

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/contribution-snake.yml"

permissions:
  contents: write

concurrency:
  group: contribution-trace
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate animated contribution SVGs
        # Platane/snk svg-only v3.5.0, pinned to an immutable commit.
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#45dcff&color_dots=#ebedf0,#b6f3ff,#57d6ff,#7c8cff,#bd68ff
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#45dcff&color_dots=#161b22,#0e3a47,#0e7490,#6154d6,#bd68ff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish SVGs to the output branch
        # crazy-max/ghaction-github-pages v4.2.0, pinned to an immutable commit.
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
